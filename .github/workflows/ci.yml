name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queueflow
          POSTGRES_PASSWORD: queueflow
          POSTGRES_DB: queueflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueflow -d queueflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://queueflow:queueflow@localhost:5432/queueflow_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://queueflow:queueflow@localhost:5432/queueflow_test

  worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workers/processor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt
      - run: ruff check worker.py tests
      - run: python -m py_compile worker.py
      - run: python -m unittest discover -s tests -v
