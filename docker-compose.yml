services:
  postgres:
    image: postgres:16
    container_name: queueflow-postgres
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
      POSTGRES_DB: queueflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: queueflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://queueflow:queueflow@postgres:5432/queueflow
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-30}
      OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
      OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-60000}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-120}
      WORKER_RECOVERY_INTERVAL_MS: ${WORKER_RECOVERY_INTERVAL_MS:-30000}
      PRIORITY_AGING_SECONDS: ${PRIORITY_AGING_SECONDS:-60}
      SEED_DEMO_TENANT: "true"
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ./apps/web
    container_name: queueflow-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"

  worker:
    build:
      context: ./workers/processor
    container_name: queueflow-worker
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://queueflow:queueflow@postgres:5432/queueflow
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET:-}
      WORKER_NAME: docker-worker
      WORKER_CPU_CAPACITY: 4
      WORKER_MEMORY_MB: 8192
      WORKER_GPU_CAPACITY: 0
      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-120}
      SQS_VISIBILITY_RENEWAL_SECONDS: ${SQS_VISIBILITY_RENEWAL_SECONDS:-30}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-5}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-60}
      RESOURCE_MISMATCH_DELAY_SECONDS: ${RESOURCE_MISMATCH_DELAY_SECONDS:-30}
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

volumes:
  postgres_data:
